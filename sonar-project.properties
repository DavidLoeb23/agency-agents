# SonarQube / SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# Agent files are Markdown and aren't analyzed; the scan covers the tooling
# (shell, Python, PowerShell) under scripts/ and integrations/.

# SonarQube Cloud's default key for an imported GitHub repo is <owner>_<repo>.
# If you're on SonarQube Server or imported under another key, change this.
sonar.projectKey=DavidLoeb23_agency-agents
sonar.projectName=agency-agents

sonar.sources=scripts,integrations
sonar.inclusions=**/*.sh,**/*.py,**/*.ps1
sonar.tests=scripts
sonar.test.inclusions=scripts/test-*.sh
sonar.exclusions=scripts/test-*.sh

sonar.python.version=3
sonar.sourceEncoding=UTF-8

# Style-only shell rules we don't follow in this repo:
#   S7679  copy positional parameters ($1, $2, ...) into named locals
#   S7682  explicit `return` at the end of every function
#   S1192  replace repeated string literals with constants
# Fixing them would rewrite most functions in the installer for no change in
# behaviour, and churn every contributor's diff.
sonar.issue.ignore.multicriteria=posparams,fnreturn,literals
sonar.issue.ignore.multicriteria.posparams.ruleKey=shelldre:S7679
sonar.issue.ignore.multicriteria.posparams.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.fnreturn.ruleKey=shelldre:S7682
sonar.issue.ignore.multicriteria.fnreturn.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.literals.ruleKey=shelldre:S1192
sonar.issue.ignore.multicriteria.literals.resourceKey=**/*.sh
