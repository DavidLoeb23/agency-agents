name: SonarQube

# Scans the repo's tooling with SonarQube Cloud by default, or a SonarQube
# Server instance when the SONAR_HOST_URL repository variable is set.
# Project settings live in sonar-project.properties.
#
# Setup (Settings → Secrets and variables → Actions):
#   secret   SONAR_TOKEN         analysis token from SonarQube (required)
#   variable SONAR_ORGANIZATION  SonarQube Cloud organization key (Cloud only)
#   variable SONAR_HOST_URL      e.g. https://sonar.example.com (Server only)
#
# Without SONAR_TOKEN (e.g. PRs from forks) the scan is skipped, not failed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check for token
        id: token
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is not set; skipping SonarQube analysis."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          # Full history so SonarQube can attribute new code and blame lines.
          fetch-depth: 0

      - name: Scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

      # Print the open issues into the job log and step summary, so they can be
      # read from GitHub without access to the SonarQube UI. Informational only:
      # it never fails the job.
      - name: List open issues
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          report=.scannerwork/report-task.txt
          if [ ! -f "$report" ]; then
            echo "No $report; nothing to list."
            exit 0
          fi
          server=$(sed -n 's/^serverUrl=//p' "$report")
          key=$(sed -n 's/^projectKey=//p' "$report")
          task=$(sed -n 's/^ceTaskUrl=//p' "$report")
          api() { curl -sSf -u "$SONAR_TOKEN:" "$@"; }

          # The server processes the report asynchronously; wait for it so the
          # issue list reflects this analysis.
          status=PENDING
          for _ in $(seq 1 30); do
            status=$(api "$task" | jq -r '.task.status')
            case "$status" in SUCCESS|FAILED|CANCELED) break ;; esac
            sleep 5
          done
          echo "Background task: $status"

          # search [scope]: fetch open issues into issues.json, print the HTTP code.
          search() {
            curl -sS -u "$SONAR_TOKEN:" -o issues.json -w '%{http_code}' -G "$server/api/issues/search" \
              --data-urlencode "componentKeys=$key" \
              --data-urlencode "resolved=false" \
              --data-urlencode "ps=500" \
              ${1:+--data-urlencode "$1"}
          }
          if [ -n "$PR_NUMBER" ]; then scope="pullRequest=$PR_NUMBER"; else scope="branch=$BRANCH"; fi
          code=$(search "$scope")
          # If SonarQube's main branch is named differently (e.g. "master"),
          # asking for "branch=main" is refused; the project's main branch is
          # what a scope-less query returns.
          if [ "$code" != 200 ] && [ -z "$PR_NUMBER" ]; then
            echo "Query with $scope returned HTTP $code: $(cat issues.json)"
            echo "Retrying for the project's main branch."
            scope="main branch"
            code=$(search)
          fi
          if [ "$code" != 200 ]; then
            echo "SonarQube returned HTTP $code:"
            cat issues.json
            echo
            exit 0
          fi

          # Diagnostics: which branches SonarQube has and how much code it
          # measured on them, to tell a real "0 issues" from an empty branch.
          echo "::group::SonarQube project diagnostics"
          echo "Branches:"
          curl -sS -u "$SONAR_TOKEN:" -G "$server/api/project_branches/list" \
            --data-urlencode "project=$key" |
            jq -r '.branches[]? | "  \(.name) isMain=\(.isMain) analysed=\(.analysisDate // "never")"' || true
          metrics="ncloc,files,code_smells,bugs,vulnerabilities"
          for b in "" "$BRANCH"; do
            echo "Measures for ${b:-main branch}:"
            curl -sS -u "$SONAR_TOKEN:" -G "$server/api/measures/component" \
              --data-urlencode "component=$key" \
              --data-urlencode "metricKeys=$metrics" \
              ${b:+--data-urlencode "branch=$b"} |
              jq -rc 'if .component then "  " + (.component.measures | map("\(.metric)=\(.value)") | join(" ")) else "  error: " + tostring end' || true
          done
          echo "::endgroup::"

          total=$(jq '.total' issues.json)
          lines=$(jq -r '.issues[] | "\(.severity // "-") \(.type // "-") \(.component | sub("^[^:]*:"; "")):\(.line // "-") [\(.rule)] \(.message)"' issues.json)
          echo "Open issues ($scope): $total"
          echo "$lines"
          {
            echo "### SonarQube: $total open issue(s) ($scope)"
            echo
            echo '```'
            echo "$lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
